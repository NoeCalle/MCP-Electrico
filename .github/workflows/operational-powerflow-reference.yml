name: operational-powerflow-reference

on:
  pull_request:
  workflow_dispatch:

jobs:
  operational-powerflow:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            python: "3.11"
          - os: windows-latest
            python: "3.12"
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}

      - name: Install validated dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt -r requirements-dev.txt
          pip check

      - name: Re-run P10B power-flow regression
        run: python -m pytest -q tests/test_p10b_reference_powerflow.py

      - name: Execute operational power-flow exercise
        run: python examples/run_operational_powerflow_reference.py --output artifacts/reference_powerflow_result.json

      - name: Upload power-flow result
        uses: actions/upload-artifact@v4
        with:
          name: reference-powerflow-${{ runner.os }}-py${{ matrix.python }}
          path: artifacts/reference_powerflow_result.json
          if-no-files-found: error
