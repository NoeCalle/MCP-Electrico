name: p10c-reference-iec60909-3ph

on:
  pull_request:
  workflow_dispatch:

jobs:
  reference-iec60909-3ph:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            python: "3.11"
            label: linux-py311
          - os: windows-latest
            python: "3.12"
            label: windows-py312
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}

      - name: Install validated dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt -r requirements-dev.txt
          pip check

      - name: Validate P10C reference IEC60909 3PH path
        run: python -m pytest -q tests/test_p10c_reference_iec60909_3ph.py
