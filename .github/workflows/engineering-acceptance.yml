name: engineering-acceptance
on:
  pull_request:
  workflow_dispatch:
jobs:
  complete-delivery:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -e ".[dev]"
      - run: python -m pytest tests/test_execution_quality.py tests/test_p10g_reference_dossier.py -q
      - run: python scripts/verify_engineering_acceptance_mcp.py --output outputs/engineering-acceptance
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: engineering-acceptance-${{ matrix.os }}
          path: outputs/engineering-acceptance
