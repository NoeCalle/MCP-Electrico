name: harmonics-opendss

on:
  pull_request:
  push:
    branches: [main]

jobs:
  harmonics:
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - run: python -m pip install -e ".[dev]"
      - run: python -m pytest tests/test_harmonics.py tests/test_reactive_compensation.py -q
      - run: python scripts/verify_harmonics_mcp.py --output harmonics_evidence
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: harmonics-${{ matrix.os }}
          path: harmonics_evidence
