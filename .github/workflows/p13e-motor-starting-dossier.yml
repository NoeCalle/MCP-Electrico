name: p13e-motor-starting-dossier

on:
  pull_request:
  workflow_dispatch:

jobs:
  motor-starting-dossier:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            python: "3.11"
          - os: windows-latest
            python: "3.12"
    runs-on: ${{ matrix.os }}
    timeout-minutes: 25

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}

      - name: Install validated dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt -r requirements-dev.txt
          pip check

      - name: Validate P13E replay-verified workspace and dossier
        run: python -m pytest -q tests/test_p13a_motor_starting_intake.py tests/test_p13b_static_motor_starting.py tests/test_p13c_motor_starting_profiles.py tests/test_p13d_motor_starting_sequences.py tests/test_p13e_motor_starting_dossier.py
