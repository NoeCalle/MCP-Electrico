name: p3c10b-ci-fix

on:
  push:
    branches:
      - feat/p3c10b-integrate-base-v3
    paths:
      - .github/workflows/p3c10b-ci-fix.yml

jobs:
  apply:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/p3c10b-integrate-base-v3
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Apply P3C10B contract fixes
        run: python scripts/_fix_p3c10b_ci.py
      - name: Syntax check
        run: python -m compileall -q mcp_electrico tests
      - name: Commit and remove temporary machinery
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add mcp_electrico/workspace_p3_view.py tests/test_ampacity_evidence_readiness.py
          git rm -f scripts/_fix_p3c10b_ci.py .github/workflows/p3c10b-ci-fix.yml
          git commit -m "test: exigir base y factores primarios en evidencia P3"
          git push origin HEAD:feat/p3c10b-integrate-base-v3
