name: p3c11b2-apply

on:
  push:
    branches:
      - feat/p3c11b2-table5b-binding
    paths:
      - .github/workflows/p3c11b2-apply.yml

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/p3c11b2-table5b-binding
          fetch-depth: 0
      - name: Repair temporary applicator syntax
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('scripts/p3c11b2_apply.py')
          text = p.read_text(encoding='utf-8')
          bad = 'rtext = roadmap.read_text(encoding="utf-8")nrtext = rtext.replace('
          good = 'rtext = roadmap.read_text(encoding="utf-8")\nrtext = rtext.replace('
          if bad not in text:
              raise SystemExit('expected temporary syntax defect not found')
          p.write_text(text.replace(bad, good, 1), encoding='utf-8')
          PY
      - name: Apply P3C11B2
        run: python scripts/p3c11b2_apply.py
      - name: Commit generated changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add mcp_electrico tests docs
          git commit -m "P3C11B2: habilitar binding Tabla 5B hasta Iz" || exit 0
          git push
