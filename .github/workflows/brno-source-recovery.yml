name: brno-source-recovery
on:
  push:
    branches: [research/brno-source-recovery]
permissions:
  contents: read
jobs:
  inventory:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python scripts/inspect_brno_source_inventory.py --output outputs/brno-recovery
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: brno-source-recovery
          path: outputs/brno-recovery
  mdf-metadata:
    runs-on: windows-2022
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - shell: pwsh
        run: python scripts/inspect_brno_source_inventory.py --output outputs/brno-recovery --mdf-copy "$env:RUNNER_TEMP/brno-public-source"
      - shell: pwsh
        run: ./scripts/install_brno_audit_localdb2019.ps1
      - shell: pwsh
        run: ./scripts/inspect_brno_mdf_metadata.ps1
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: brno-mdf-derived-schema
          path: outputs/brno-mdf
  lf-replay:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install opendssdirect.py==0.9.4 dss-python==0.15.7 dss-python-backend==0.14.5
      - run: python scripts/replay_brno_loadflow_research.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: brno-lf-research-comparison
          path: outputs/brno-lf-replay
