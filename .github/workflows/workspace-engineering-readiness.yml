name: workspace-engineering-readiness

on:
  pull_request:
  workflow_dispatch:

jobs:
  readiness-view:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            python: "3.11"
          - os: windows-latest
            python: "3.12"
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20

    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - name: Install
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev]"
      - name: Readiness view tests
        run: python -m pytest -q tests/test_workspace_engineering_readiness.py tests/test_workspace_p5.py tests/test_p8e_real_workspace_v5.py
