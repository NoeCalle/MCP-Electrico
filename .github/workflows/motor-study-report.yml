name: motor-study-report

on:
  pull_request:
  push:
    branches: [main]

jobs:
  motor-report:
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - run: python -m pip install -e ".[dev]"
      - run: python -m pytest tests/test_motor_study_report.py tests/test_modelica_motor_adapter.py -q
      - run: python scripts/verify_motor_report_mcp.py --output motor_report_evidence
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: motor-report-${{ matrix.os }}
          path: motor_report_evidence
