name: p8d2-real-protection-execution

on:
  push:
    branches: [main]
  pull_request:

jobs:
  p8d2-protection:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - name: Install dependencies
        run: pip install -r requirements-dev.txt
      - name: Run P8D2 focused tests
        run: python -m pytest -q tests/test_p8d2_real_protection_execution.py tests/test_p8d1_real_controlled_execution.py tests/test_p8c4b_real_protection_materializer.py
      - name: Verify P8D2 execution boundary
        run: |
          python - <<'PY'
          from mcp_electrico import real_protection_execution as p8d2
          assert p8d2._ALLOWED_CURRENT_QUANTITIES == {"ikss_ka"}
          assert p8d2._ALLOWED_FAULT_TYPES == {"3ph", "1ph-ground"}
          print("P8D2 explicit fault binding boundary PASS")
          PY
