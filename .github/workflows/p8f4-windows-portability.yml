name: p8f4-windows-portability

on:
  pull_request:
  workflow_dispatch:

jobs:
  p8f4-windows-python312:
    runs-on: windows-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt -r requirements-dev.txt
          pip check

      - name: Regress P7B/P8E2 isolation on Windows
        run: |
          python -m pytest -q tests/test_p7b_project_reconstruction.py tests/test_p8e2_real_project_dossier.py

      - name: Run P8F4 first-use through MCP stdio on Windows
        run: |
          python examples/p8_first_use_mcp.py --manifest examples/p8_first_use_manifest.json --output-dir "$env:RUNNER_TEMP\p8f4_windows_dossier" --summary "$env:RUNNER_TEMP\p8f4_windows_summary.json"

      - name: Upload Windows P8F4 diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: p8f4-windows-python312-diagnostics
          if-no-files-found: ignore
          path: |
            ${{ runner.temp }}/p8f4_windows_summary.json
            ${{ runner.temp }}/p8f4_windows_dossier/**
