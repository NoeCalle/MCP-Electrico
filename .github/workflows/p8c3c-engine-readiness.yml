name: p8c3c-engine-readiness

on:
  push:
    branches: [main]
  pull_request:

jobs:
  p8c3c-readiness:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - name: Install dependencies
        run: pip install -r requirements-dev.txt
      - name: Run P8C3C focused tests
        run: python -m pytest -q tests/test_p8c3c_engine_readiness.py
      - name: Verify readiness remains non-executing
        run: |
          python - <<'PY'
          from mcp_electrico import real_model_readiness
          assert real_model_readiness.SCHEMA == "MCP_ELECTRICO_P8C3C_ENGINE_READINESS_V1"
          assert real_model_readiness.STATUS_READY == "READY_FOR_CONTROLLED_EXECUTION"
          print("P8C3C non-executing readiness contract PASS")
          PY
