name: tests

on:
  push:
    branches: [main]
  pull_request:

jobs:
  pytest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - name: Install dependencies
        run: pip install -r requirements-dev.txt
      - name: Run tests
        run: python -m pytest -q
      - name: Generate P1 benchmark report
        run: |
          python examples/run_benchmarks_p1.py
          test -s benchmark_p1.json
          grep -q '"failed": 0' benchmark_p1.json
          grep -q '"pass": true' benchmark_p1.json
      - name: Upload P1 benchmark report
        uses: actions/upload-artifact@v4
        with:
          name: mcp-electrico-benchmarks-p1
          path: benchmark_p1.json
      - name: Generate P3B numeric dataset benchmark
        run: |
          python examples/run_benchmarks_p3b.py
          test -s benchmark_p3b.json
          grep -q '"failed": 0' benchmark_p3b.json
          grep -q '"pass": true' benchmark_p3b.json
          grep -q '"evidence_level": "SECONDARY"' benchmark_p3b.json
          grep -q '"professional_emission": false' benchmark_p3b.json
      - name: Upload P3B benchmark report
        uses: actions/upload-artifact@v4
        with:
          name: mcp-electrico-benchmarks-p3b
          path: benchmark_p3b.json
      - name: Generate P3C12 independent primary benchmark
        run: |
          python examples/run_benchmarks_p3c12.py
          test -s benchmark_p3c12.json
          grep -q '"failed": 0' benchmark_p3c12.json
          grep -q '"pass": true' benchmark_p3c12.json
          grep -q '"reference_evidence": "PRIMARY_INDEPENDENT"' benchmark_p3c12.json
          grep -q '"independent_reference": true' benchmark_p3c12.json
      - name: Upload P3C12 independent benchmark
        uses: actions/upload-artifact@v4
        with:
          name: mcp-electrico-benchmarks-p3c12
          path: benchmark_p3c12.json
      - name: Generate P4C09A independent 3PH benchmark
        run: |
          python examples/benchmark_p4_3ph.py --output benchmark_p4_3ph.json
          test -s benchmark_p4_3ph.json
          grep -q '"pass": true' benchmark_p4_3ph.json
          grep -q '"depends_on_pandapower": false' benchmark_p4_3ph.json
          grep -q '"depends_on_opendss": false' benchmark_p4_3ph.json
          grep -q '"p4c09_complete": false' benchmark_p4_3ph.json
          grep -q '"professional_emission": false' benchmark_p4_3ph.json
      - name: Upload P4C09A independent 3PH benchmark
        uses: actions/upload-artifact@v4
        with:
          name: mcp-electrico-benchmarks-p4-3ph
          path: benchmark_p4_3ph.json
      - name: Generate P5G protection benchmark
        run: |
          python examples/run_benchmarks_p5g.py --output benchmark_p5g.json
          test -s benchmark_p5g.json
          grep -q '"failed": 0' benchmark_p5g.json
          grep -q '"pass": true' benchmark_p5g.json
          grep -q '"curve_source_type": "TEST_DATA"' benchmark_p5g.json
          grep -q '"manufacturer_claim": false' benchmark_p5g.json
          grep -q '"normative_compliance_claim": false' benchmark_p5g.json
          grep -q '"professional_emission": false' benchmark_p5g.json
      - name: Upload P5G protection benchmark
        uses: actions/upload-artifact@v4
        with:
          name: mcp-electrico-benchmarks-p5g
          path: benchmark_p5g.json
      - name: Generate reproducible P7A project snapshot
        run: |
          python examples/export_project_p7a.py --output project_p7a.json --netlist-dir project_p7a_dss
          test -s project_p7a.json
          grep -q '"schema": "MCP_ELECTRICO_P7A_PROJECT_SNAPSHOT_V1"' project_p7a.json
          grep -q '"algorithm": "sha256"' project_p7a.json
          grep -q '"professional_emission": false' project_p7a.json
          python - <<'PY'
          import json
          from pathlib import Path
          from mcp_electrico import project_snapshot
          snapshot = json.loads(Path("project_p7a.json").read_text(encoding="utf-8"))
          check = project_snapshot.verificar_snapshot(snapshot)
          assert check["ok"] is True, check
          assert check["status"] == "HASH_MATCH", check
          print(check)
          PY
      - name: Upload P7A reproducible project snapshot
        uses: actions/upload-artifact@v4
        with:
          name: mcp-electrico-project-p7a
          path: project_p7a.json
      - name: Generate technical single-line diagram
        run: |
          python examples/unifilar_tecnico.py
          test -s unifilar_tecnico.svg
          test -s unifilar_tecnico.html
      - name: Generate persistent workspace with studies
        run: |
          python examples/workspace_hospital.py
          test -s workspace_hospital.html
          test -s workspace_hospital_unifilar.svg
          grep -q "RESUELTO" workspace_hospital.html
          grep -q "Imprimir / PDF" workspace_hospital.html
          grep -q "workspace-snapshot" workspace_hospital.html
          grep -q "workspace-catalog" workspace_hospital.html
          grep -q "elementSelect" workspace_hospital.html
          grep -q "inspectorBody" workspace_hospital.html
          grep -q 'data-element-id="Line.f_motor"' workspace_hospital.html
          grep -q 'data-tab="flujo"' workspace_hospital.html
          grep -q 'data-tab="caida"' workspace_hospital.html
          grep -q 'data-tab="protecciones"' workspace_hospital.html
          grep -q 'id="panel-flujo"' workspace_hospital.html
          grep -q 'id="panel-caida"' workspace_hospital.html
          grep -q 'id="panel-protecciones"' workspace_hospital.html
          grep -q "MCP-P5-PROTECTION-V5" workspace_hospital.html
          grep -q 'data-module="mcp-p5-protection-v5"' workspace_hospital.html
          grep -q "Criterio configurable" workspace_hospital.html
          grep -q '"voltage_drop"' workspace_hospital.html
          grep -q '"flow"' workspace_hospital.html
      - name: Validate workspace JavaScript syntax
        run: |
          python - <<'PY'
          from pathlib import Path
          import re
          html = Path("workspace_hospital.html").read_text(encoding="utf-8")
          scripts = []
          for match in re.finditer(r'<script(?P<attrs>[^>]*)>(?P<body>.*?)</script>', html, re.S):
              if 'application/json' in match.group('attrs'):
                  continue
              path = Path(f"/tmp/workspace-script-{len(scripts)}.js")
              path.write_text(match.group('body'), encoding="utf-8")
              scripts.append(path)
          if not scripts:
              raise SystemExit("No se encontraron scripts ejecutables en el workspace")
          print("\n".join(str(path) for path in scripts))
          PY
          for script in /tmp/workspace-script-*.js; do
            node --check "$script"
          done
      - name: Upload visual artifacts
        uses: actions/upload-artifact@v4
        with:
          name: mcp-electrico-visuals
          path: |
            unifilar_tecnico.svg
            unifilar_tecnico.html
            workspace_hospital.html
            workspace_hospital_unifilar.svg
