name: tests

on:
  push:
    branches: [main]
  pull_request:

jobs:
  pytest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - name: Install dependencies
        run: pip install -r requirements-dev.txt
      - name: Run tests
        run: python -m pytest -q
      - name: Generate technical single-line diagram
        run: |
          python examples/unifilar_tecnico.py
          test -s unifilar_tecnico.svg
          test -s unifilar_tecnico.html
      - name: Upload technical single-line diagram
        uses: actions/upload-artifact@v4
        with:
          name: unifilar-tecnico
          path: |
            unifilar_tecnico.svg
            unifilar_tecnico.html
