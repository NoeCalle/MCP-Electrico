name: ref01-validation

on:
  push:
    branches:
      - feat/reference-case-01

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - name: Install dependencies
        run: pip install -r requirements-dev.txt
      - name: Full regression suite
        run: python -m pytest -q
      - name: Execute REF-01
        run: |
          python examples/caso_referencia_01.py --output /tmp/ref01.json
          test -s /tmp/ref01.json
          grep -q '"pass": true' /tmp/ref01.json
          grep -q '"engine_under_test": "OpenDSS"' /tmp/ref01.json
          grep -q '"depends_on_opendss": false' /tmp/ref01.json
          grep -q '"tolerances_match_p1": true' /tmp/ref01.json
          grep -q '"professional_emission": false' /tmp/ref01.json
