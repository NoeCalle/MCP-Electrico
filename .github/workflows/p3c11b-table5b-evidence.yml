name: p3c11b-table5b-evidence

on:
  push:
    branches:
      - feat/p3c11b-table5b-primary
    paths:
      - .github/workflows/p3c11b-table5b-evidence.yml

permissions:
  contents: read

jobs:
  capture:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install PDF tools
        run: pip install pypdf pymupdf

      - name: Download pinned official CNE
        shell: bash
        run: |
          set -euo pipefail
          URL='https://cdn.www.gob.pe/uploads/document/file/898623/C%C3%B3digo_Nacional_de_Electricidad__Utilizaci%C3%B3n_.pdf'
          curl -L --fail --retry 3 \
            -A 'Mozilla/5.0' \
            -e 'https://www.gob.pe/' \
            -o cne_utilizacion.pdf "$URL"
          ACTUAL="$(sha256sum cne_utilizacion.pdf | awk '{print $1}')"
          EXPECTED='2b3cbd457c519bf9d9aa2cf2754c72b6e531708e45ea2fdf91f839b1acccfd64'
          echo "source_sha256=$ACTUAL"
          test "$ACTUAL" = "$EXPECTED"

      - name: Locate and render Tabla 5B
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p p3c11b_table5b
          python - <<'PY'
          import json
          from pathlib import Path
          import fitz
          from pypdf import PdfReader

          pdf = Path('cne_utilizacion.pdf')
          reader = PdfReader(str(pdf))
          matches = []
          for i, page in enumerate(reader.pages):
              text = page.extract_text() or ''
              compact = ' '.join(text.split())
              if 'Tabla 5B' in text or ('5B' in text and 'resistividad' in text.lower()):
                  matches.append({'index0': i, 'page1': i + 1, 'text': text})

          print('MATCH_COUNT', len(matches))
          if not matches:
              raise SystemExit('Tabla 5B no localizada')

          doc = fitz.open(str(pdf))
          summary = []
          out = Path('p3c11b_table5b')
          for n, match in enumerate(matches, 1):
              i = match['index0']
              page = doc[i]
              png = out / f'table5b_page_{i+1}.png'
              txt = out / f'table5b_page_{i+1}.txt'
              page.get_pixmap(matrix=fitz.Matrix(2.0, 2.0), alpha=False).save(str(png))
              txt.write_text(match['text'], encoding='utf-8')
              summary.append({
                  'pdf_page_index_zero_based': i,
                  'pdf_page_number_one_based': i + 1,
                  'png': png.name,
                  'txt': txt.name,
              })
              print(f'--- MATCH PDF PAGE {i+1} ---')
              print(match['text'][:12000])

          payload = {
              'source_id': 'MINEM_CNE_UTIL_2006_OFFICIAL_PDF',
              'source_sha256': '2b3cbd457c519bf9d9aa2cf2754c72b6e531708e45ea2fdf91f839b1acccfd64',
              'table': 'Tabla 5B',
              'matches': summary,
          }
          (out / 'table5b_capture.json').write_text(json.dumps(payload, ensure_ascii=False, indent=2), encoding='utf-8')
          PY

      - name: Upload evidence artifact
        uses: actions/upload-artifact@v4
        with:
          name: p3c11b-table5b-evidence
          path: p3c11b_table5b/
