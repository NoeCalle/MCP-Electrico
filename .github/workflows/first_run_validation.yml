name: first-run-validation

on:
  push:
    branches:
      - feat/first-run-smoke-clean

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - name: Install dependencies
        run: pip install -r requirements-dev.txt
      - name: Full regression suite
        run: python -m pytest -q
      - name: Execute first-run smoke
        run: |
          python examples/primer_uso.py --output-dir /tmp/mcp-first-run
          test -s /tmp/mcp-first-run/workspace_primer_uso.html
          test -s /tmp/mcp-first-run/resultado_primer_uso.json
          grep -q '"ok": true' /tmp/mcp-first-run/resultado_primer_uso.json
          grep -q '"executed_engine": "OpenDSS"' /tmp/mcp-first-run/resultado_primer_uso.json
          grep -q '"automatic_dispatch": false' /tmp/mcp-first-run/resultado_primer_uso.json
          grep -q '"crosscheck": false' /tmp/mcp-first-run/resultado_primer_uso.json
