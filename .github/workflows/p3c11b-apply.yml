name: p3c11b-apply

on:
  push:
    branches:
      - feat/p3c11b-table5b-primary
    paths:
      - .github/workflows/p3c11b-apply.yml

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/p3c11b-table5b-primary
          fetch-depth: 0

      - name: Apply P3C11B1
        run: python scripts/p3c11b_apply.py

      - name: Commit generated block
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add mcp_electrico/data/ampacity_p3b_numeric_datasets.json \
                  mcp_electrico/data/ampacity_primary_review_candidates.json \
                  tests/test_p3c11b_table5b_primary.py \
                  docs/P3C11B_TABLE5B_PRIMARY.md \
                  docs/ROADMAP_PROFESIONAL.md
          git commit -m 'P3C11B1: incorporar Tabla 5B primaria completa'
          git push origin HEAD:feat/p3c11b-table5b-primary
