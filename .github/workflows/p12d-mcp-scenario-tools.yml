name: p12d-mcp-scenario-tools

on:
  pull_request:
  workflow_dispatch:

jobs:
  mcp-scenario-tools:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            python: "3.11"
          - os: windows-latest
            python: "3.12"
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}

      - name: Install validated dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt -r requirements-dev.txt
          pip check

      - name: Validate P12D MCP scenario tools
        run: python -m pytest -q tests/test_p12d_mcp_scenario_tools.py
