name: motor-fault-thermal
on:
  pull_request:
  workflow_dispatch:
jobs:
  thermal-contract:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -e ".[dev]"
      - run: python -m pytest tests/test_motor_fault_thermal.py tests/test_sc_machines.py -q
  native-motor-fault:
    runs-on: windows-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -e ".[dev]"
      - uses: OpenModelica/setup-openmodelica@419f31141aa79a22f7033def5626047dd3bb5069
        with:
          version: '1.27.1'
          architecture: '64'
          packages: omc
          libraries: ''
      - uses: actions/checkout@v4
        with:
          repository: modelica/ModelicaStandardLibrary
          ref: v4.0.0
          path: msl-source
      - name: Prepare unmodified official MSL and run actual MCP fault benchmarks
        shell: pwsh
        run: |
          $mslRoot = Join-Path $env:RUNNER_TEMP 'MSL4-fault'
          New-Item -ItemType Directory -Path $mslRoot | Out-Null
          Copy-Item -LiteralPath 'msl-source/Modelica','msl-source/ModelicaServices','msl-source/Complex.mo' -Destination $mslRoot -Recurse
          $omcPath = (Get-Command omc).Source
          python scripts/verify_motor_fault_thermal_mcp.py --omc $omcPath --msl $mslRoot --output outputs/motor-fault-emt
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: motor-fault-emt-native
          path: outputs/motor-fault-emt
