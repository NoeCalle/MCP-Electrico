name: p3c11d-table5d-evidence

on:
  push:
    branches:
      - feat/p3c11d-table5d-primary
    paths:
      - .github/workflows/p3c11d-table5d-evidence.yml

permissions:
  contents: read

jobs:
  capture:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install PDF tools
        run: pip install pypdf pymupdf
      - name: Download pinned official CNE
        shell: bash
        run: |
          set -euo pipefail
          URL='https://cdn.www.gob.pe/uploads/document/file/898623/C%C3%B3digo_Nacional_de_Electricidad__Utilizaci%C3%B3n_.pdf'
          curl -L --fail --retry 3 -A 'Mozilla/5.0' -e 'https://www.gob.pe/' -o cne_utilizacion.pdf "$URL"
          ACTUAL="$(sha256sum cne_utilizacion.pdf | awk '{print $1}')"
          EXPECTED='2b3cbd457c519bf9d9aa2cf2754c72b6e531708e45ea2fdf91f839b1acccfd64'
          echo "source_sha256=$ACTUAL"
          test "$ACTUAL" = "$EXPECTED"
      - name: Locate and render Tabla 5D
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p p3c11d_table5d
          python - <<'PY'
          import json
          from pathlib import Path
          import pymupdf as fitz
          from pypdf import PdfReader

          pdf = Path('cne_utilizacion.pdf')
          reader = PdfReader(str(pdf))
          matches = []
          for i, page in enumerate(reader.pages):
              text = page.extract_text() or ''
              if 'Tabla 5D' in text or ('5D' in text and 'ductos' in text.lower() and 'circuit' in text.lower()):
                  matches.append({'index0': i, 'page1': i + 1, 'text': text})

          print('MATCH_COUNT', len(matches))
          if not matches:
              raise SystemExit('Tabla 5D no localizada')

          doc = fitz.open(str(pdf))
          out = Path('p3c11d_table5d')
          summary = []
          for match in matches:
              i = match['index0']
              page = doc[i]
              png = out / f'table5d_page_{i+1}.png'
              txt = out / f'table5d_page_{i+1}.txt'
              page.get_pixmap(matrix=fitz.Matrix(2.0, 2.0), alpha=False).save(str(png))
              txt.write_text(match['text'], encoding='utf-8')
              summary.append({'index0': i, 'page1': i + 1, 'png': png.name, 'txt': txt.name})
              print(f'--- MATCH PDF PAGE {i+1} ---')
              print(match['text'][:16000])

          payload = {
              'source_id': 'MINEM_CNE_UTIL_2006_OFFICIAL_PDF',
              'source_sha256': '2b3cbd457c519bf9d9aa2cf2754c72b6e531708e45ea2fdf91f839b1acccfd64',
              'table': 'Tabla 5D',
              'matches': summary,
          }
          (out / 'table5d_capture.json').write_text(json.dumps(payload, ensure_ascii=False, indent=2), encoding='utf-8')
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: p3c11d-table5d-evidence
          path: p3c11d_table5d/
