name: p3c10c-discover-base-tables

on:
  push:
    branches:
      - feat/p3c10c-base-table-evidence
    paths:
      - .github/workflows/p3c10c-discover-base-tables.yml

jobs:
  discover:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install PDF dependencies
        run: pip install pypdf pymupdf
      - name: Download and verify pinned CNE
        run: |
          python - <<'PY'
          from hashlib import sha256
          from pathlib import Path
          import json
          from urllib.request import Request, urlopen

          registry = json.loads(Path("mcp_electrico/data/ampacity_primary_sources.json").read_text(encoding="utf-8"))
          source = next(item for item in registry["sources"] if item["id"] == "MINEM_CNE_UTIL_2006_OFFICIAL_PDF")
          request = Request(
              source["direct_url"],
              headers={
                  "User-Agent": "Mozilla/5.0 (X11; Linux x86_64) AppleWebKit/537.36 Chrome/150 Safari/537.36",
                  "Accept": "application/pdf,application/octet-stream;q=0.9,*/*;q=0.8",
                  "Referer": source["landing_url"],
              },
          )
          with urlopen(request, timeout=60) as response:
              data = response.read()
          digest = sha256(data).hexdigest()
          if digest != source["expected_sha256"]:
              raise SystemExit(f"P3C10C refused: hash {digest} != pin {source['expected_sha256']}")
          Path("/tmp/cne.pdf").write_bytes(data)
          print(f"PIN_OK sha256={digest} size={len(data)}")
          PY
      - name: Discover candidate pages for Table 1 and Table 2
        run: |
          python - <<'PY'
          from pathlib import Path
          import json
          import re
          from pypdf import PdfReader

          reader = PdfReader("/tmp/cne.pdf")
          results = {"table_1": [], "table_2": []}
          patterns = {
              "table_1": re.compile(r"(?:TABLA|Tabla)\s+1(?:\s|$|[-–—:.])"),
              "table_2": re.compile(r"(?:TABLA|Tabla)\s+2(?:\s|$|[-–—:.])"),
          }
          for index, page in enumerate(reader.pages):
              raw = page.extract_text() or ""
              normalized = re.sub(r"\s+", " ", raw).strip()
              for key, pattern in patterns.items():
                  if pattern.search(normalized):
                      match = pattern.search(normalized)
                      start = max(0, match.start() - 180)
                      end = min(len(normalized), match.end() + 420)
                      results[key].append({
                          "pdf_page_index_zero_based": index,
                          "pdf_page_number_one_based": index + 1,
                          "context": normalized[start:end],
                      })

          Path("p3c10c_discovery.json").write_text(
              json.dumps(results, indent=2, ensure_ascii=False) + "\n",
              encoding="utf-8",
          )
          print(json.dumps(results, ensure_ascii=False))
          PY
      - name: Render discovered candidate pages
        run: |
          python - <<'PY'
          from pathlib import Path
          import json
          import pymupdf

          results = json.loads(Path("p3c10c_discovery.json").read_text(encoding="utf-8"))
          doc = pymupdf.open("/tmp/cne.pdf")
          out = Path("p3c10c_pages")
          out.mkdir()
          seen = set()
          for key, items in results.items():
              for item in items:
                  index = item["pdf_page_index_zero_based"]
                  if index in seen:
                      continue
                  seen.add(index)
                  page = doc[index]
                  pix = page.get_pixmap(matrix=pymupdf.Matrix(1.6, 1.6), alpha=False)
                  pix.save(out / f"page_{index + 1}.png")
          print(f"rendered={len(seen)}")
          PY
      - name: Upload discovery evidence
        uses: actions/upload-artifact@v4
        with:
          name: p3c10c-base-table-discovery
          path: |
            p3c10c_discovery.json
            p3c10c_pages/*.png
