name: p3c10b-apply

on:
  push:
    branches:
      - feat/p3c10b-integrate-base-v3
    paths:
      - .github/workflows/p3c10b-apply.yml

jobs:
  apply:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/p3c10b-integrate-base-v3
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Apply deterministic P3C10B patch
        run: python scripts/_apply_p3c10b.py
      - name: Syntax check
        run: python -m compileall -q mcp_electrico tests
      - name: Commit applied patch and remove temporary machinery
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add mcp_electrico/ampacity.py \
                  mcp_electrico/ampacity_tools.py \
                  mcp_electrico/ampacity_evidence_readiness.py \
                  mcp_electrico/workspace_p3_view.py \
                  tests/test_ampacity_normative_base_p3c10b.py \
                  docs/P3C10_BASE_AMPACITY_STRATEGY.md
          git rm scripts/_apply_p3c10b.py .github/workflows/p3c10b-apply.yml
          git commit -m "feat: integrar Iz_base normativo con cálculo y V3"
          git push origin HEAD:feat/p3c10b-integrate-base-v3
