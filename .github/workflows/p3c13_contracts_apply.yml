name: p3c13-contracts-apply

on:
  push:
    branches:
      - feat/p3c13-close-p3

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/p3c13-close-p3
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Update P3C13 contracts
        run: python scripts/_update_p3c13_contracts.py
      - name: Commit contract updates
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add tests
          if git diff --cached --quiet; then
            echo "No contract changes"
          else
            git commit -m "P3C13: actualizar contratos históricos al gate cerrado"
            git push
          fi
