name: real-design-cables
on:
  pull_request:
  workflow_dispatch:
jobs:
  lupech-cables:
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    env:
      DOTNET_CLI_TELEMETRY_OPTOUT: '1'
      POWERSHELL_TELEMETRY_OPTOUT: '1'
      OTEL_SDK_DISABLED: 'true'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -e ".[dev]"
      - run: python -m pytest tests/test_lupech_real_cables.py tests/test_p5c_protection_checks.py -q
      - run: python scripts/verify_lupech_cables_mcp.py --output outputs/lupech-cables --verify-upstream
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: lupech-cables-${{ matrix.os }}
          path: outputs/lupech-cables
