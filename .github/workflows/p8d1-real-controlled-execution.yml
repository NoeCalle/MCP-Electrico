name: p8d1-real-controlled-execution

on:
  push:
    branches: [main]
  pull_request:

jobs:
  p8d1-execution:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - name: Install dependencies
        run: pip install -r requirements-dev.txt
      - name: Run P8D1 focused tests
        run: python -m pytest -q tests/test_p8d1_real_controlled_execution.py tests/test_p8d1_runtime_state_integrity.py tests/test_p8c5_integrated_readiness.py
      - name: Verify P8D1 execution boundary
        run: |
          python - <<'PY'
          from mcp_electrico import real_controlled_execution as p8d1
          assert p8d1.PROTECTION not in p8d1.EXECUTABLE_SCOPES
          assert p8d1.SC_3PH in p8d1.EXECUTABLE_SCOPES
          assert p8d1.SC_1PH in p8d1.EXECUTABLE_SCOPES
          print("P8D1 explicit P1/P3/P4 boundary PASS")
          PY
