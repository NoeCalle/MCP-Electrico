name: p13f-dynamic-preparation

on:
  pull_request:
  workflow_dispatch:

jobs:
  dynamic-preparation:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            python: "3.11"
          - os: windows-latest
            python: "3.12"
    runs-on: ${{ matrix.os }}
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - name: Install
        run: python -m pip install -e ".[dev]"
      - name: Dependency consistency
        run: python -m pip check
      - name: Validate physical inputs and independent analytical references
        run: python -m pytest -q -p no:faulthandler tests/test_p13f_dynamic_preparation.py tests/test_p13a_motor_starting_intake.py tests/test_p13f_rms_dynamics.py tests/test_p13f_dynamic_dossier.py tests/test_modelica_motor_adapter.py tests/test_visual_sheets.py
