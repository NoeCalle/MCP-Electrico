name: time-series-opendss

on:
  pull_request:
  push:
    branches: [main]

jobs:
  time-series:
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - run: python -m pip install -e ".[dev]"
      - run: python -m pytest tests/test_time_series.py tests/test_reactive_compensation.py tests/test_harmonics.py -q
      - run: python scripts/verify_time_series_mcp.py --output time_series_evidence
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: time-series-${{ matrix.os }}
          path: time_series_evidence
