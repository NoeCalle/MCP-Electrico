name: industrial-diagnostic
on:
  pull_request:
  workflow_dispatch:
jobs:
  unam-diagnostic:
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    env:
      DOTNET_CLI_TELEMETRY_OPTOUT: '1'
      POWERSHELL_TELEMETRY_OPTOUT: '1'
      OTEL_SDK_DISABLED: 'true'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -e ".[dev,qualification]"
      - run: python -m pytest tests/test_unam_industrial_diagnostic.py tests/test_transformer_external_qualification.py -q
      - run: python scripts/verify_unam_industrial_mcp.py --output outputs/unam-industrial --verify-upstream
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: unam-industrial-${{ matrix.os }}
          path: outputs/unam-industrial
