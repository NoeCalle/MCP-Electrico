name: p12e-alternative-source-transfer

on:
  pull_request:
  workflow_dispatch:

jobs:
  alternative-source-transfer:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            python: "3.11"
          - os: windows-latest
            python: "3.12"
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}

      - name: Install validated dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt -r requirements-dev.txt
          pip check

      - name: Validate P12E explicit alternative source transfer
        run: python -m pytest -q tests/test_p12e_alternative_source_transfer.py
