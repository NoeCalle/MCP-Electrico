name: p14b-local-runtime

on:
  pull_request:
  workflow_dispatch:

jobs:
  local-runtime:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            python: "3.11"
          - os: windows-latest
            python: "3.12"
    runs-on: ${{ matrix.os }}
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - name: Install
        run: python -m pip install -e ".[dev]"
      - name: Dependency consistency
        run: python -m pip check
      - name: Verify real MCP transports and isolated dossiers
        run: python -m pytest -q -p no:faulthandler tests/test_local_mcp_transport.py
