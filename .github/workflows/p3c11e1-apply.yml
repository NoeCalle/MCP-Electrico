name: p3c11e1-apply
on:
  push:
    branches: [feat/p3c11e-table5e-primary]
    paths: [.github/workflows/p3c11e1-apply.yml]
permissions:
  contents: write
jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/p3c11e-table5e-primary
          fetch-depth: 0
      - run: python scripts/p3c11e1_apply.py
      - name: Commit generated changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add mcp_electrico tests docs
          git commit -m "P3C11E1: incorporar Tabla 5E primaria completa" || exit 0
          git push
