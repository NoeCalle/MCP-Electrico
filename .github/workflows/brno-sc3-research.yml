name: brno-sc3-research
on:
  push:
    branches: [research/brno-sc3]
permissions:
  contents: read
jobs:
  replay:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install pandapower==3.5.4
      - run: python scripts/replay_brno_sc3_research.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: brno-sc3-research
          path: outputs/brno-sc3-research
